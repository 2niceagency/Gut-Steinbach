name: Deploy Vorschau auf GitHub Pages

on:
  push:
    branches:
      - claude/gut-steinbach-website-rebuild-2o7hk2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys nacheinander abarbeiten statt gegenseitig abbrechen
# (verhindert das Aufstauen der Pages-Warteschlange)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Nur die eigentlichen Website-Dateien veröffentlichen (nicht das
      # impeccable-Tooling, docs etc.) -> schlankeres, schnelleres Artefakt
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r assets _site/
          cp *.html robots.txt sitemap.xml llms.txt _site/ 2>/dev/null || true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
          error_count: 25
